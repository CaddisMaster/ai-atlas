# Ruff as linter only, matching the sibling projects. Test configuration lives
# in pytest.ini, deliberately kept where it is.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    # Reported, not enforced — same call as the sibling projects.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["atlas", "tests"]
